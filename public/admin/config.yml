# Sveltia CMS（Decap CMS 的现代轻量替代）配置
#
# 你的需求：纯网页零终端写作 —— 在任何设备/浏览器打开本站 /admin/，
# 点「Login with GitHub」授权后，就能直接在线新建/编辑/上传文章，
# 保存即自动 commit 到 GitHub → Cloudflare Pages 自动重新部署。全程不用碰终端。
#
# ✅ 一次性配置步骤（只需做一遍，详见 docs/写作后台配置.md）：
#   1. 注册一个 GitHub OAuth App：GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#      - Homepage URL: https://zfzblog.pages.dev
#      - Authorization callback URL: https://你的worker名.workers.dev/callback
#   2. 部署免费 OAuth 代理（sveltia-cms-auth，Cloudflare Workers 免费档即可）
#      → 得到你的 worker 域名，填到下面 backend.base_url
#   3. backend.repo 改成本仓库（已预填 Jiboyu78/zfzblog）

backend:
  name: github
  repo: Jiboyu78/zfzblog
  branch: main
  # Sveltia CMS GitHub OAuth 代理（Cloudflare Workers 免费部署）
  base_url: https://zfzouath.lnzfz.workers.dev

media_folder: public/img/uploads
public_folder: /img/uploads

site_url: https://zfzblog.pages.dev
locale: zh-Hans

publish_mode: editorial_workflow

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'blog/{{slug}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text, required: false }
      - { label: 发布日期, name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 更新日期, name: updatedDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        summary: '{{fields.tag}}'
        field: { label: 标签, name: tag, widget: string }
      - label: 分类
        name: category
        widget: select
        default: 随笔
        options: [OI, AI, 工程, 随笔, 比赛]
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 精选, name: featured, widget: boolean, default: false, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      - { label: 正文, name: body, widget: markdown }
