<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#dceaf7"/>
      <stop offset="48%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f6f0f7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.24" r="0.42">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c6e4"/>
      <stop offset="100%" stop-color="#c6dcf0"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba3cd"/>
      <stop offset="100%" stop-color="#9dbfe0"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d79ab"/>
      <stop offset="100%" stop-color="#6d97c4"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6b52"/>
      <stop offset="100%" stop-color="#57846a"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1920" height="900" fill="url(#sky)"/>
  <rect width="1920" height="900" fill="url(#sun)"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity=".55">
    <ellipse cx="300" cy="180" rx="180" ry="46"/>
    <ellipse cx="410" cy="160" rx="120" ry="52"/>
    <ellipse cx="210" cy="200" rx="110" ry="34"/>
    <ellipse cx="1520" cy="130" rx="210" ry="40"/>
    <ellipse cx="1650" cy="112" rx="130" ry="46"/>
    <ellipse cx="1390" cy="150" rx="110" ry="30"/>
  </g>

  <!-- 远山 -->
  <path d="M0 640 Q 240 520 480 590 Q 700 660 920 560 Q 1160 450 1380 540 Q 1620 640 1920 520 L1920 900 L0 900Z" fill="url(#hill1)" opacity=".75"/>
  <!-- 中山 -->
  <path d="M0 740 Q 300 640 560 700 Q 820 760 1080 670 Q 1360 570 1620 680 Q 1780 745 1920 700 L1920 900 L0 900Z" fill="url(#hill2)" opacity=".85"/>
  <!-- 近山 -->
  <path d="M0 850 Q 340 780 680 830 Q 1040 880 1380 800 Q 1680 730 1920 790 L1920 900 L0 900Z" fill="url(#hill3)"/>

  <!-- 树 -->
  <g fill="url(#tree)">
    <path d="M180 830 L180 690 L150 730 L165 730 L120 780 L145 780 L95 838 Z"/>
    <path d="M1740 838 L1740 700 L1712 738 L1726 738 L1684 786 L1706 786 L1660 842 Z"/>
    <path d="M1560 856 L1560 760 L1540 786 L1550 786 L1520 820 L1536 820 L1500 858 Z"/>
  </g>

  <!-- 代码雨（等宽风的关键符号） -->
  <g font-family="'Maple Mono', monospace" font-size="26" fill="#5c8ec6" opacity=".38">
    <text x="120" y="130">&lt;/&gt;</text>
    <text x="330" y="90">{ }</text>
    <text x="560" y="150">=&gt;</text>
    <text x="810" y="100">#[ ]</text>
    <text x="1060" y="140">::</text>
    <text x="1300" y="95">&lt;/&gt;</text>
    <text x="1520" y="160">(* *)</text>
    <text x="1760" y="100">{ }</text>
  </g>
  <g font-family="'Maple Mono', monospace" font-size="18" fill="#6fa3ef" opacity=".26">
    <text x="60" y="300">fn main() {</text>
    <text x="200" y="340">let ans = solve();</text>
    <text x="420" y="290">println!("hi");</text>
    <text x="700" y="330">O(n log n)</text>
    <text x="900" y="285">dp[i][j]</text>
    <text x="1150" y="325">∑ f(i)</text>
    <text x="1400" y="290">→ ∞</text>
    <text x="1650" y="335">λ x. x</text>
  </g>

  <!-- 前景剪影：小屋 -->
  <g transform="translate(1450 660)">
    <rect x="0" y="60" width="180" height="120" fill="#3f5f85"/>
    <path d="M-16 62 L90 8 L196 62 Z" fill="#33506f"/>
    <rect x="70" y="110" width="40" height="70" fill="#2b4661"/>
    <rect x="18" y="88" width="34" height="30" fill="#ffe9a8" opacity=".9"/>
    <rect x="128" y="88" width="34" height="30" fill="#ffe9a8" opacity=".9"/>
  </g>

  <!-- 地面 -->
  <rect y="862" width="1920" height="38" fill="#3f6b52" opacity=".35"/>
</svg>
