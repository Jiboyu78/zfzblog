<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#122339"/>
      <stop offset="100%" stop-color="#1b1533"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.78" cy="0.72" r="0.55">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.52" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <!-- 网格地平线 -->
  <g stroke="#7dd3fc" stroke-opacity=".10" fill="none">
    <path d="M0 700 Q 960 620 1920 700"/>
    <path d="M0 760 Q 960 680 1920 760"/>
    <path d="M0 820 Q 960 740 1920 820"/>
    <path d="M0 880 Q 960 800 1920 880"/>
    <path d="M0 940 Q 960 860 1920 940"/>
    <path d="M0 1000 Q 960 920 1920 1000"/>
    <path d="M0 1060 Q 960 980 1920 1060"/>
  </g>
  <g stroke="#7dd3fc" stroke-opacity=".08">
    <path d="M-200 1080 L 700 700"/>
    <path d="M200 1080 L 860 700"/>
    <path d="M600 1080 L 1020 700"/>
    <path d="M1000 1080 L 1180 700"/>
    <path d="M1400 1080 L 1340 700"/>
    <path d="M1800 1080 L 1500 700"/>
    <path d="M2200 1080 L 1660 700"/>
  </g>

  <!-- 星星 -->
  <g fill="#e0f2fe">
    <circle cx="180" cy="140" r="2.2" opacity=".85"/>
    <circle cx="420" cy="86"  r="1.4" opacity=".6"/>
    <circle cx="700" cy="180" r="1.8" opacity=".7"/>
    <circle cx="980" cy="96"  r="1.2" opacity=".5"/>
    <circle cx="1240" cy="150" r="2"   opacity=".8"/>
    <circle cx="1520" cy="72"  r="1.5" opacity=".55"/>
    <circle cx="1760" cy="210" r="2.4" opacity=".75"/>
    <circle cx="300" cy="300" r="1.3" opacity=".45"/>
    <circle cx="860" cy="280" r="1.6" opacity=".5"/>
    <circle cx="1400" cy="330" r="1.1" opacity=".4"/>
    <circle cx="60"  cy="470" r="1.7" opacity=".4"/>
    <circle cx="1880" cy="430" r="1.3" opacity=".45"/>
  </g>

  <!-- 大 M 剪影（OI 氛围） -->
  <g fill="none" stroke="#7dd3fc" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 880 V600 l160 150 l160 -150 V880"/>
  </g>
</svg>
